<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enter Password | CloudGPT</title>

  <style>
    /* ── Reset ── */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ── Page Layout ── */
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #000000;
      color: #f4f4f5;
      position: relative;
      overflow-x: hidden;
      padding: 2rem 1rem;
    }

    /* ── Brand Logo ── */
    .brand {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
      z-index: 1;
      text-decoration: none;
    }

    /* ── Card Container ── */
    .card {
      position: relative;
      z-index: 1;
      width: min(100%, 420px);
      padding: 36px;
      border-radius: 16px;
      background: #0c0c0e;
      border: 1px solid #26262a;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.75);
    }

    /* ── Typography ── */
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      color: #ffffff;
      font-weight: 700;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #9ca3af;
      font-size: 14px;
      line-height: 1.4;
    }

    /* ── Flash Messages ── */
    .flash-message {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.4;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .flash-error {
      background: rgba(234, 67, 53, 0.12);
      border: 1px solid rgba(234, 67, 53, 0.35);
      color: #fca5a5;
    }

    /* ── Google-Style Error Indicators ── */
    .google-error-msg {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      font-size: 12px;
      color: #ea4335;
      line-height: 1.3;
      text-align: left;
    }

    .google-error-icon {
      flex-shrink: 0;
      width: 14px;
      height: 14px;
      fill: #ea4335;
    }

    .input-error {
      border-color: #ea4335 !important;
    }

    .input-error:focus {
      outline: 2px solid #ea4335 !important;
    }

    /* ── Form Labels ── */
    .field-label {
      display: block;
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 700;
      color: #e5e7eb;
    }

    /* ── Email Display ── */
    .email-display {
      display: flex;
      align-items: center;
      margin: 0 0 20px;
      padding: 12px 14px;
      background: #2a2a2a;
      border: 1px solid #4b4b4b;
      border-radius: 9px;
    }

    .email-display span {
      color: #e5e7eb;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #2e2e34;
      border-radius: 9px;
      font-size: 15px;
      background: #141418;
      color: #ffffff;
      font-family: inherit;
    }

    input:focus {
      outline: 2px solid #ffffff;
      border-color: #ffffff;
    }

    input::placeholder {
      color: #6b7280;
    }

    /* ── Password Field ── */
    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 46px;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #6b7280;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: #ffffff;
    }

    /* ── Primary Button ── */
    .primary {
      width: 100%;
      min-height: 46px;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      border: 0;
      color: #000000;
      background: #ffffff;
      transition: background 0.2s ease;
      font-family: inherit;
    }

    .primary:hover {
      background: #e5e7eb;
    }

    /* ── Links ── */
    .forgot-wrapper {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
      margin-bottom: 2px;
    }

    .forgot-link {
      font-size: 13px;
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .forgot-link:hover {
      color: #e5e5e5;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      font-size: 13px;
      color: #9ca3af;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #ffffff;
    }
  </style>
</head>

<body>

  <!-- Brand -->
  <a href="/" class="brand">CloudGPT</a>

  <!-- Password Card -->
  <main class="card">
    <h1>Welcome back</h1>
    <p class="subtitle">Enter your Password to Continue</p>

    <!-- Flash Messages -->
    {% if error %}
    <div class="flash-message flash-error" role="alert">
      <svg class="google-error-icon" viewBox="0 0 24 24" width="16" height="16">
        <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
      </svg>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <!-- Email Display -->
    <label class="field-label">Email Address</label>
    <div class="email-display">
      <span id="display-email">{{ email }}</span>
    </div>

    <!-- Password Form -->
    <form id="password-form" action="/login" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <input type="hidden" id="hidden-email" name="email" value="{{ email }}" />
      <label for="password" class="field-label">Password</label>
      <div class="password-wrapper">
        <input id="password" name="password" type="password" required placeholder="Enter your password" autocomplete="current-password" autofocus class="{% if error %}input-error{% endif %}" />
        <button type="button" class="toggle-password" id="toggle-password" aria-label="Show password" title="Show password">
          <svg class="eye-icon eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg class="eye-icon eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
            <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
            <line x1="2" y1="2" x2="22" y2="22"></line>
          </svg>
        </button>
      </div>
      {% if error %}
      <div class="google-error-msg">
        <svg class="google-error-icon" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
        <span>Wrong password. Try again or click Forgot password to reset it.</span>
      </div>
      {% endif %}
      <div class="forgot-wrapper">
        <a href="/forgot-password" class="forgot-link">Forgot password?</a>
      </div>
      <button class="primary" type="submit">Sign In</button>
    </form>

    <div style="text-align: center;">
      <a href="/" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Back to sign in</span>
      </a>
    </div>

  </main>

  <script>
    const toggleBtn = document.getElementById('toggle-password');
    const pwdInput = document.getElementById('password');
    if (toggleBtn && pwdInput) {
      const eyeShow = toggleBtn.querySelector('.eye-show');
      const eyeHide = toggleBtn.querySelector('.eye-hide');
      toggleBtn.addEventListener('click', () => {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        const label = isPassword ? 'Hide password' : 'Show password';
        toggleBtn.setAttribute('aria-label', label);
        toggleBtn.setAttribute('title', label);
        if (eyeShow && eyeHide) {
          eyeShow.style.display = isPassword ? 'none' : 'block';
          eyeHide.style.display = isPassword ? 'block' : 'none';
        }
      });
    }
  </script>

</body>

</html>
