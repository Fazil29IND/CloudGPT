apiVersion: 1

# CloudGPT — Grafana datasource provisioning (auto-wired on container start).
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://cloudgpt_prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  - name: Loki
    type: loki
    access: proxy
    url: http://cloudgpt_loki:3100
    editable: false
    jsonData:
      maxLines: 1000
